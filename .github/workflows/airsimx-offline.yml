name: AirsimX offline checks

# Runs every suite that needs neither Unreal nor a flight controller:
# the Python client, the airsimx tool tests, and the ROS 2 conversion
# tests. Simulator checks (PX4, ROS 2 bridge, Gymnasium) stay manual --
# they need Windows + Unreal and a second machine, see
# docs/airsimx/windows-development.md.
#
# The suites run through tools/airsimx/ci/run_offline.py so a local run and
# a CI run produce the same result.json, including the source commit and the
# dependency versions.
#
# Actions are pinned to commit SHAs and Python packages to the versions the
# validation environment used; keep both pinned so a passing run stays
# reproducible.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r PythonClient/requirements-v01-windows.txt
          python -m pip install -r PythonClient/requirements-gym.txt

      - name: Run offline suites
        shell: bash
        run: |
          python tools/airsimx/ci/run_offline.py --output build/airsimx/ci/github-${{ matrix.os }}

      - name: Show report
        if: always()
        shell: bash
        run: cat build/airsimx/ci/github-${{ matrix.os }}/result.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: offline-${{ matrix.os }}-py${{ matrix.python }}
          path: build/airsimx/ci/github-${{ matrix.os }}/result.json
